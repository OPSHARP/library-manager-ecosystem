name: library_student_app
description: "Student Self-Service Portal - Library Management"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # UI
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

  # QR Scanner
  mobile_scanner: ^5.1.1

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.4
  cloud_firestore: ^5.6.6
  flutter_local_notifications: ^18.0.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10

  # Ads (AdMob) — free plan shows a single non-intrusive bottom banner on
  # content screens (one ad at a time; interstitials are disabled to prevent
  # banner+interstitial overlap). Uses TEST ad unit IDs until production IDs
  # are swapped in (see core/services/ad_config_service.dart).
  google_mobile_ads: ^5.2.0
  google_sign_in: ^7.2.0
  geolocator: ^14.0.2
  http: ^1.6.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  fluttertoast: ^9.1.0
  image_picker: ^1.1.2
  app_links: ^6.3.2

  # In-App Updates (Android Play Core — flexible background downloads)
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
